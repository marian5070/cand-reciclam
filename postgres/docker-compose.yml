services:
  postgres:
    image: postgres:16-alpine
    container_name: cand-reciclam-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: cand_reciclam
      POSTGRES_USER: cand_reciclam
      POSTGRES_PASSWORD: dev_local_only
    ports:
      - "127.0.0.1:55442:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cand_reciclam -d cand_reciclam"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
    name: cand-reciclam-pgdata
